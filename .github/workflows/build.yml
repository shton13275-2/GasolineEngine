name: Build

on:
  push:
    branches: [main, 'ios/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - name: Check out repository (exclude docs)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CMakeLists.txt
            assets
            include
            shaders
            src
            tests
          sparse-checkout-cone-mode: true

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -A x64 -DORIGINALENGINE_BUILD_APP=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test (initialize SDL and render one frame)
        run: .\\build\\Release\\originalengine_app.exe --smoke-test

      - name: Run camera unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GasolineEngine-Windows-x64
          path: |
            build/Release/originalengine_app.exe
            build/Release/SDL3.dll
            build/Release/assets/demo.obj
            build/Release/assets/demo_texture.ppm
          if-no-files-found: error
          retention-days: 14

  ios-unsigned-ipa:
    name: iOS Device / Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Check out repository (exclude docs)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CMakeLists.txt
            assets
            include
            shaders
            src
            tests
          sparse-checkout-cone-mode: true

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Record Xcode version
        id: xcode-version
        shell: bash
        run: |
          xcode_version="$(xcodebuild -version | paste -sd ' ' -)"
          echo "version=$xcode_version" >> "$GITHUB_OUTPUT"

      - name: Cache SDL3 source
        uses: actions/cache@v4
        with:
          path: build-ios/_deps/sdl3-src
          key: ios-sdl3-source-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ios-sdl3-source-${{ runner.os }}-

      - name: Configure iOS Device
        run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DORIGINALENGINE_BUILD_APP=ON
          -DBUILD_TESTING=OFF
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Verify iOS bundle identifier setting
        shell: bash
        run: |
          settings="$(
            xcodebuild \
              -project build-ios/GasolineEngine.xcodeproj \
              -target originalengine_app \
              -configuration Release \
              -sdk iphoneos \
              -showBuildSettings
          )"
          printf '%s\\n' "$settings" | grep -E "PRODUCT_BUNDLE_IDENTIFIER|INFOPLIST_KEY_CFBundleIdentifier" || true
          if ! printf '%s\\n' "$settings" | grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = com.gasolineengine.demo"; then
            echo "::error::Xcode did not report the expected PRODUCT_BUNDLE_IDENTIFIER for originalengine_app."
            exit 1
          fi

      - name: Build unsigned iOS app
        run: >-
          cmake --build build-ios --config Release --parallel
          -- -sdk iphoneos
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          APP_PATH="$(find build-ios -type d -name originalengine_app.app -print -quit)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          /usr/bin/zip -qry GasolineEngine-iOS-unsigned.ipa Payload

      - name: Verify IPA
        run: |
          test -s ipa/GasolineEngine-iOS-unsigned.ipa
          /usr/bin/unzip -t ipa/GasolineEngine-iOS-unsigned.ipa
          /usr/bin/unzip -l ipa/GasolineEngine-iOS-unsigned.ipa
          /usr/bin/unzip -Z1 ipa/GasolineEngine-iOS-unsigned.ipa | grep -Fxq "Payload/originalengine_app.app/Info.plist"
          /usr/bin/unzip -Z1 ipa/GasolineEngine-iOS-unsigned.ipa | grep -Fxq "Payload/originalengine_app.app/originalengine_app"
          bundle_id="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" ipa/Payload/originalengine_app.app/Info.plist)"
          test "$bundle_id" = "com.gasolineengine.demo"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GasolineEngine-iOS-unsigned-IPA
          path: ipa/GasolineEngine-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  discord-notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [windows, ios-unsigned-ipa]
    if: always() && needs.ios-unsigned-ipa.result == 'success'
    steps:
      - name: Send detailed build report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          IOS_RESULT: ${{ needs.ios-unsigned-ipa.result }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not configured. Discord notification skipped."
            exit 0
          fi

          jobs_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")
          job_report=$(jq -r '
            [.jobs[] |
              "• **" + .name + "** — " + (.conclusion // .status // "unknown") +
              (if ([.steps[]?] | length) > 0 then
                "\\n" + ([.steps[] | "  - " + .name + ": " + (.conclusion // .status // "unknown")] | join("\\n"))
              else "" end)
            ] | join("\\n\\n")
          ' <<< "$jobs_json")

          started_at=$(jq -r '[.jobs[].started_at // empty] | sort | first // empty' <<< "$jobs_json")
          finished_at=$(jq -r '[.jobs[].completed_at // empty] | sort | last // empty' <<< "$jobs_json")
          duration="In progress / unavailable"
          if [ -n "$started_at" ] && [ -n "$finished_at" ]; then
            start_epoch=$(date -u -d "$started_at" +%s)
            end_epoch=$(date -u -d "$finished_at" +%s)
            elapsed=$((end_epoch - start_epoch))
            duration="$((elapsed / 60))m $((elapsed % 60))s"
          fi

          payload=$(jq -n \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg commit "$COMMIT_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            --arg actor "$ACTOR" \
            --arg event "$EVENT_NAME" \
            --arg run "$RUN_NUMBER" \
            --arg attempt "$RUN_ATTEMPT" \
            --arg duration "$duration" \
            --arg report "$job_report" \
            --arg url "$RUN_URL" \
            --arg windows "$WINDOWS_RESULT" \
            --arg ios "$IOS_RESULT" \
            '{
              embeds: [{
                title: "GasolineEngine — Detailed Build Report",
                description: ("**Overall:** " +
                  (if ([$windows, $ios] | all(. == "success")) then "SUCCESS" else "CHECK REQUIRED" end) +
                  "\\n**Workflow:** " + $workflow +
                  "\\n**Branch:** " + $branch +
                  "\\n**Commit:** [" + ($commit[0:7]) + "](" + $url + ")" +
                  "\\n**Message:** " + $message),
                color: (if ([$windows, $ios] | all(. == "success")) then 5763719 else 15548997 end),
                fields: [
                  {name: "Windows", value: $windows, inline: true},
                  {name: "iOS unsigned IPA", value: $ios, inline: true},
                  {name: "Triggered by", value: $actor, inline: true},
                  {name: "Event", value: $event, inline: true},
                  {name: "Run", value: ("#" + $run + " / attempt " + $attempt), inline: true},
                  {name: "Build duration", value: $duration, inline: true},
                  {name: "Job and step details", value: (if $report == "" then "No job details returned." else $report end), inline: false}
                ],
                url: $url,
                footer: {text: "GasolineEngine • GitHub Actions"}
              }]
            }')

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
